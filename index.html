<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buy list</title>
    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>
	<div class="container">
		<main class="left-part">
			<div class="new-product-form">
				<input type="text" class="add-input" placeholder="Назва товару">
				<button class="add-button" data-tooltip="додати новий товар">Додати</button>
			</div>
			<div class="list">
			<hr/>
			<div class="products">
				<div class="product-name">Помідори</div>
				<div class="product-controlers">
					<button class="button-minus" aria-label="Зменшити" data-tooltip="зменшити кількість">-</button>
					<span class="quantity-label">2</span>
					<button class="button-plus" aria-label="Збільшити" data-tooltip="збільшити кількість">+</button>
				</div>
				<div class="product-status">
					<button class="button-bought" data-tooltip="товар вже купили">Куплено</button>
					<button class="button-delete" aria-label="Видалити" data-tooltip="видалити товар зі списку">×</button>
				</div>
			</div>
			<hr/>
			<div class="products">
				<div class="product-name">Печиво</div>
				<div class="product-controlers">
					<button class="button-minus" aria-label="Зменшити" data-tooltip="зменшити кількість">-</button>
					<span class="quantity-label">2</span>
					<button class="button-plus" aria-label="Збільшити" data-tooltip="збільшити кількість">+</button>
				</div>
				<div class="product-status">
					<button class="button-bought" data-tooltip="товар вже купили">Куплено</button>
					<button class="button-delete" aria-label="Видалити" data-tooltip="видалити товар зі списку">×</button>
				</div>
			</div>
			<hr/>
			<div class="products">
				<div class="product-name">Сир</div>
				<div class="product-controlers">
					<button class="button-minus disabled" aria-label="Зменшити" data-tooltip="зменшити кількість">-</button>
					<span class="quantity-label">1</span>
					<button class="button-plus" aria-label="Збільшити" data-tooltip="збільшити кількість">+</button>
				</div>
				<div class="product-status">
					<button class="button-bought" data-tooltip="товар вже купили">Куплено</button>
					<button class="button-delete" aria-label="Видалити" data-tooltip="видалити товар зі списку">×</button>
				</div>
			</div>
			</div>
		</main>
		<aside class="right-part"></aside>
	</div>
	<div class="badge">
		<div class="badge-title">Buy List</div>
		<div class="badge-myName">Created by:<br> Bordachenko Sofiia</div>
	</div>
	<script src="jsFile.js"></script>
</body>
</html>
